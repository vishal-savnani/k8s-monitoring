apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.observability.svc.cluster.local:9090
        isDeafault: true
        editable: false
        jsonData:
          timeInterval: "15s"
          httpMethod: POST
