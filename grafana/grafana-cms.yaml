apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: observability
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Kubernetes'
        folderUid: 'kubernetes'
        type: file
        disableDeletion: true      # prevent accidental deletion from UI
        editable: false            # dashboards are managed by code not UI
        updateIntervalSeconds: 30  # check for updates every 30 seconds
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app: grafana
data:
  # Kubernetes cluster overview dashboard
  cluster-overview.json: |
    {
      "title": "Kubernetes Cluster Overview",
      "uid": "k8s-cluster-overview",
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Running Pods",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{
            "expr": "count(kube_pod_status_phase{phase=\"Running\"})",
            "legendFormat": "Running Pods"
          }],
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "title": "Total Nodes",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{
            "expr": "count(kube_node_info)",
            "legendFormat": "Nodes"
          }],
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "title": "CPU Usage per Node",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [{
            "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
            "legendFormat": "{{instance}}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 4,
          "title": "Memory Usage per Node",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [{
            "expr": "100 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100)",
            "legendFormat": "{{instance}}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "id": 5,
          "title": "Pod Restarts (last 1h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [{
            "expr": "increase(kube_pod_container_status_restarts_total[1h]) > 0",
            "legendFormat": "{{namespace}}/{{pod}}"
          }]
        },
        {
          "id": 6,
          "title": "etcd Leader",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{
            "expr": "etcd_server_has_leader",
            "legendFormat": "Leader"
          }],
          "options": {
            "colorMode": "background"
          }
        },
        {
          "id": 7,
          "title": "API Server Request Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [{
            "expr": "sum(rate(apiserver_request_total[5m])) by (verb)",
            "legendFormat": "{{verb}}"
          }]
        }
      ],
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {}
    }
