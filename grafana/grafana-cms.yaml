apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: observability
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Kubernetes'
        folderUid: 'kubernetes'
        type: file
        disableDeletion: true      # prevent accidental deletion from UI
        editable: false            # dashboards are managed by code not UI
        updateIntervalSeconds: 30  # check for updates every 30 seconds
        options:
          path: /var/lib/grafana/dashboards
