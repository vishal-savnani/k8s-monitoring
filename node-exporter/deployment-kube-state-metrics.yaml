apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kube-state-metrics
  name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  strategy: {}
  template:
    metadata:
      labels:
        app: kube-state-metrics
      annotations:
        prometheus.io/port: "8080"
        prometheus.io/scrap: "true"
    spec:
      serviceAccountName: kube-state-metrics-sa 
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.0
        name: kube-state-metrics
        resources: 
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        ports:
         - containerPort: 8080
           name: metrics
         - containerPort: 8081
           name: telemetry
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 5
          timeoutSeconds: 5
