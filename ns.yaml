apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: observability-stack
spec:
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: observability
spec:
  hard:
      cpu: "100"
      memory: "8Gi"
      persistentvolumeclaims: "10"
      pods: "50"
      replicationcontrollers: "10"
      resourcequotas: "1"
      secrets: "10"
      services: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: observability-limit
  namespace: observability
spec:
  limits:
   - type: Container
     default:
       cpu: 200m
       memory: 128Mi
     max:
       cpu: 500m
       memory: 512Mi
     min:
       cpu: 100m
       memory: 128Mi